[package]
name = "run-only-proof"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
# The extracted `run` module (see ../extract-run-only.sh), renamed so the spike's driver code compiles unchanged.
rig-agent = { package = "run-only", path = "../vendor/run-only" }
rig-core = { version = "0.46.0", default-features = false, features = ["test-utils", "reqwest"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
