[package]
name = "agent-loop"
version = "0.1.10"
edition = "2024"
rust-version = "1.97.1"
description = "Agent loop core: our Model, ToolHost and SessionStore traits and a driver over rig-agent's sans-I/O run. Early; not published."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/agent-loop"
readme = "README.md"
publish = false

[dependencies]
rig-agent = "0.46.0"
rig-core = "0.46.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
sha2 = "0.11.1"
persistant = { version = "0.16.16", optional = true }

[dev-dependencies]
rig-agent = { version = "0.46.0", features = ["test-utils"] }
rig-core = { version = "0.46.0", features = ["test-utils"] }
tokio = { version = "1", features = ["macros", "rt"] }

[features]
# Records stored through PersistAnt (docs/RUN-RECORD.md). Off by default: it pulls in OpenDAL.
persistant = ["dep:persistant"]
